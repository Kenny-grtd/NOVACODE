<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro · NOVACODE</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="auth">
      <h1>Crear cuenta</h1>
      <form id="form-registro" novalidate>
        <div class="grid">
          <div class="field">
            <label for="nombres">Nombres</label>
            <input id="nombres" name="nombres" required autocomplete="given-name" />
          </div>
          <div class="field">
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" name="apellidos" required autocomplete="family-name" />
          </div>
          <div class="field">
            <label for="tipo_identificacion">Tipo de documento</label>
            <!-- TODO: ajustar opciones a las de la versión 1 -->
            <select id="tipo_identificacion" name="tipo_identificacion" required>
              <option value="">Selecciona...</option>
              <option value="CC">Cédula de ciudadanía</option>
              <option value="CE">Cédula de extranjería</option>
              <option value="TI">Tarjeta de identidad</option>
              <option value="PA">Pasaporte</option>
            </select>
          </div>
          <div class="field">
            <label for="numero_identificacion">Número de documento</label>
            <input id="numero_identificacion" name="numero_identificacion" required inputmode="numeric" />
          </div>
          <div class="field">
            <label for="telefono">Teléfono (opcional)</label>
            <input id="telefono" name="telefono" type="tel" autocomplete="tel" />
          </div>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="confirmar">Confirmar contraseña</label>
            <input id="confirmar" name="confirmar" type="password" required autocomplete="new-password" />
          </div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
        <p id="exito" class="exito" role="status" hidden>
          Cuenta creada con éxito. <a href="login.html">Inicia sesión</a>.
        </p>
        <button class="btn" type="submit">Registrarme</button>
      </form>
      <p class="alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </main>
    <script type="module" src="js/pages/registro.js"></script>
  </body>
</html>
